name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  claude-plugin:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      # マーケットプレイスの検証は各プラグインの plugin.json までしか見ないため、
      # 同梱スキル（SKILL.md の frontmatter 等）はプラグイン単位で検証する
      - name: Validate each plugin
        run: |
          status=0
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict || status=1
          done
          exit "$status"

  apm-package:
    name: Validate APM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: "true"

      - name: Validate manifest and resolve package
        run: apm install --target claude

      - name: Verify skill deployment
        run: |
          status=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ ! -f ".claude/skills/$name/SKILL.md" ]; then
              echo "::error::スキル '$name' が .claude/skills/ に配備されていません"
              status=1
            fi
          done
          exit "$status"

  skill-lint:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifests and skill constraints
        run: ./scripts/lint-skills.sh

      - name: Check generated skills are in sync with SSoT
        run: ./scripts/sync-skills.sh --check
