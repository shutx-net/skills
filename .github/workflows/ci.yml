name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  claude-plugin:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate impl plugin
        run: claude plugin validate plugins/impl --strict

  apm-package:
    name: Validate APM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: "true"

      - name: Validate manifest and resolve package
        run: apm install --target claude

      - name: Verify skill deployment
        run: test -f .claude/skills/impl/SKILL.md

  skill-lint:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Check manifests and skill constraints
        run: python3 scripts/lint_skills.py

      - name: Check generated skills are in sync with SSoT
        run: python3 scripts/sync_skills.py --check
